name: ArmorSet
version: '${project.version}'
main: dev.fabbrini.armorset.ArmorSetPlugin
api-version: '1.21'
folia-supported: true
author: fabbrini
description: Four legendary Netherite armor pieces with unique abilities.

commands:
  armorset:
    description: Manage legendary armor pieces.
    usage: /armorset <give|holders> ...

permissions:
  armorset.give:
    description: Allows giving legendary armor pieces to players.
    default: op
  armorset.holders:
    description: Allows checking which online players currently have a legendary armor piece.
    default: true
